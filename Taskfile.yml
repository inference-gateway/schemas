---
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  mcp-schema-download:
    desc: "Download the MCP schema for the pinned protocol version and convert to YAML"
    vars:
      MCP_PROTOCOL_VERSION: "2026-07-28"
    cmds:
      - bun install
      - curl -fsSL -o mcp/mcp-schema.json https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/refs/heads/main/schema/{{.MCP_PROTOCOL_VERSION}}/schema.json
      - |
        echo "Converting JSON schema to YAML format"
        bun -e "
          const fs = require('fs');
          const yaml = require('js-yaml');
          const json = JSON.parse(fs.readFileSync('mcp/mcp-schema.json', 'utf8'));
          fs.writeFileSync('mcp/mcp-schema.yaml', yaml.dump(json, {lineWidth: -1}));
        "
      - task: format

  a2a-schema-download:
    desc: "Download the A2A proto (pin with A2A_REF=refs/tags/vX.Y.Z, a branch ref, or a SHA), generate its JSON schema and convert to YAML"
    vars:
      A2A_REF: '{{.A2A_REF | default "refs/tags/v1.0.1"}}'
    cmds:
      - bun install
      - go install github.com/bufbuild/protoschema-plugins/cmd/protoc-gen-jsonschema@v0.6.0
      - curl -fsSL -o a2a/a2a.proto https://raw.githubusercontent.com/a2aproject/A2A/{{.A2A_REF}}/specification/a2a.proto
      - mkdir -p a2a/tmp
      - cp a2a/a2a.proto a2a/a2a-jsonrpc.proto a2a/tmp/
      - curl -fsSL -o a2a/tmp/buf.yaml https://raw.githubusercontent.com/a2aproject/A2A/{{.A2A_REF}}/specification/buf.yaml
      - curl -fsSL -o a2a/tmp/buf.lock https://raw.githubusercontent.com/a2aproject/A2A/{{.A2A_REF}}/specification/buf.lock
      - |
        echo "Converting proto to JSON schema using buf and protoc"
        cat > a2a/tmp/buf.gen.yaml <<EOF
        version: v2
        plugins:
          - local: protoc-gen-jsonschema
            out: ..
            opt: target=json-strict-bundle
        EOF
        cd a2a/tmp
        PATH="$(go env GOPATH)/bin:$PATH" buf generate
        cd ../..
      - |
        echo "Processing bundled schema"
        bun scripts/process-bundle.js
      - |
        echo "Adding required fields from proto annotations"
        bun scripts/add-required-fields.js
      - |
        echo "Checking A2AMethod against the A2AService rpcs"
        bun scripts/check-methods.js
      - rm -rf a2a/tmp
      - task: format

  format:
    desc: "Format all YAML files"
    cmds:
      - bun run format

  openapi:format:
    desc: "Format OpenAPI Spec"
    cmds:
      - bun run openapi:format

  lint:
    desc: "Lint all Markdown files"
    cmds:
      - bun run lint

  lint:fix:
    desc: "Lint and auto-fix all Markdown files"
    cmds:
      - bun run lint:fix

  openapi:lint:
    desc: "Lint OpenAPI spec"
    cmds:
      - bun run openapi:lint

  check-reachable:
    desc: "Verify streaming-payload schemas are reachable in openapi.yaml"
    cmds:
      - bun run check-reachable

  release:dry:
    desc: "Preview the next release locally (semantic-release dry run)"
    cmds:
      - bun install
      - bun run release:dry
