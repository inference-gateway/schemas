schema-version = "1.19.0"

[install]
go.pkg-path = "go"
go.version = "1.27.3"
go.pkg-group = "go"
bun.pkg-path = "bun"
bun.version = "^1.4.4"
bun.pkg-group = "bun"
protobuf.pkg-path = "protobuf"
protobuf.version = "^36.2"
go-task.pkg-path = "go-task"
go-task.version = "^3.53.1"
buf.pkg-path = "buf"
buf.version = "^1.75.0"
buf.pkg-group = "buf"
prettier.pkg-path = "prettier"
prettier.version = "^3.9.10"
prettier.pkg-group = "prettier"
markdownlint-cli.pkg-path = "markdownlint-cli"
markdownlint-cli.version = "0.50.0"
infer.flake = "github:inference-gateway/cli/v0.231.1"
claude-code.pkg-path = "claude-code"
claude-code.version = "^2.1.321"
claude-code.pkg-group = "claude-code"
codex.pkg-path = "codex"
codex.version = "^0.167.1"
codex.pkg-group = "codex"

[hook]
on-activate = '''
    bun install --frozen-lockfile
'''
